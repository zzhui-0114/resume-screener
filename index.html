<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 简历筛选系统</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f5f6f8;
        min-height: 100vh;
        color: #1a1a1a;
      }
      /* CSS 变量模拟 Claude 设计系统 */
      :root {
        --color-background-primary: #ffffff;
        --color-background-secondary: #f5f6f8;
        --color-background-info: #e6f1fb;
        --color-background-success: #eaf3de;
        --color-background-danger: #fdecea;
        --color-border-primary: #d0d3d9;
        --color-border-secondary: #d0d3d9;
        --color-border-tertiary: #e5e7eb;
        --color-border-success: #a3c97a;
        --color-border-danger: #f5a9a2;
        --color-text-primary: #1a1a1a;
        --color-text-secondary: #4b5563;
        --color-text-tertiary: #9ca3af;
        --color-text-success: #3b6d11;
        --color-text-warning: #92400e;
        --color-text-danger: #b91c1c;
        --color-text-info: #0c447c;
        --border-radius-sm: 6px;
        --border-radius-md: 8px;
        --border-radius-lg: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
